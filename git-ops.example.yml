  #       - action: checkout
  #         branch: main
  #         pull: true
  #         label: Switch to main
  #       - action: create_branch
  #         branch: hotfix/{name}
  #         label: Create hotfix branch

# ============================================================================
# Usage Logging
# ============================================================================
logging:
  enabled: true                  # Enable usage tracking
  log_file: ~/.git-ops/usage.jsonl
  log_errors: true               # Also log failed operations

# ============================================================================
# Custom Aliases (Shortcuts)
# ============================================================================
# Define short aliases for common operations
# Usage: gops "s" → gops "stash"
aliases:
  # Stash shortcuts
  s: stash
  sp: stash pop
  sa: stash apply
  sl: stash list
  sd: stash drop

  # Branch shortcuts
  cm: checkout main
  cd: checkout develop
  cb: checkout -

  # Commit shortcuts
  c: commit
  ca: commit --amend
  cap: commit and push
  cp: commit and push

  # Search shortcuts
  grep: search for
  find: search for

  # Other shortcuts
  unstage: reset HEAD
  undo: reset --soft HEAD~1

# ============================================================================
# Custom Patterns (Natural Language Extensions)
# ============================================================================
# Define custom natural language patterns
# These are checked before standard parsing
custom_patterns:
  # Work-in-progress shortcuts
  save: stash with message 'WIP'
  save work: stash with message 'work in progress'
  quick save: stash

  # Quick commits
  quick commit: commit 'wip' and push
  qc: commit 'wip'

  # Sync workflows
  sync: pull with rebase
  sync main: checkout main, pull, checkout -
  update: pull with rebase

  # Cleanup workflows
  clean up: stash, checkout main, pull
  fresh start: stash, checkout main, pull, checkout -b

# ============================================================================
# Operation Priorities
# ============================================================================
# Auto-populated by pattern_analyzer.py
# You can also manually adjust priorities here
priorities:
  # Example (usually auto-generated):
  # stash: high_priority
  # commit: high_priority
  # checkout: medium_priority
  # grep: normal

# ============================================================================
# Behavior Customization
# ============================================================================
behavior:
  auto_fetch: true              # Automatically fetch before operations
  use_force_with_lease: true    # Use --force-with-lease instead of --force
  interactive_mode: false       # Interactive mode for ambiguous commands
  verbose: false                # Show verbose output

# ============================================================================
# Personal Preferences (Examples)
# ============================================================================

# Example 1: Always use merge instead of rebase
# git:
#   sync_mode: merge

# Example 2: Disable all confirmations (DANGEROUS!)
# safety:
#   confirm_destructive: false
#   confirm_hard_reset: false
#   confirm_force_push: false
#   confirm_branch_delete: false

# Example 3: Create a complete workflow alias
# aliases:
#   deploy: checkout main, pull, merge develop, push, checkout develop

# Example 4: Team-specific shortcuts
# aliases:
#   pr: checkout -b
#   review: checkout
#   done: merge main, push, delete branch

# ============================================================================
# Notes
# ============================================================================
# - Aliases are checked first, before custom patterns
# - Custom patterns support partial matching
# - Configuration is loaded in this order:
#   1. Default config (built-in)
#   2. Config file (this file)
#   3. Command-line arguments (override everything)
# - Use quotes for multi-word patterns
# - Boolean values: true|false
# - Null values: null or ~
